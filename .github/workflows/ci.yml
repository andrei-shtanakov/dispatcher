name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run pytest tests/ -v

  plan-fields:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plan-fields
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pytest
      # PF-7 external-install guard: the package must BUILD with its contract
      # data and run conformance from a CLEAN venv (not the editable in-tree
      # install). The editable install hid a force-include double-add that broke
      # every external consumer; this step is the standing proof that a pinned
      # git/wheel dependency resolves and works.
      - name: wheel builds and conforms from a clean install
        run: |
          uv build
          uv venv /tmp/pf-smoke
          uv pip install --python /tmp/pf-smoke dist/*.whl
          /tmp/pf-smoke/bin/plan-fields conformance

  vscode-ext:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-ext
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
