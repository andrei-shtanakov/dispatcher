name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
      # Node is a hard prerequisite of test_task_authoring_js.py (the
      # task-authoring screen's client-JS harness) — pinned explicitly
      # rather than relying on whatever ubuntu-latest happens to preinstall,
      # so that test's assert-not-skip guarantee has a fixed version behind
      # it, matching the vscode-ext job's convention below.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      # DESIGN-405 level 3 exercises the REAL github-checker, and its skipif is
      # gone: the step below is now the only thing standing between the suite
      # and a red job. That is deliberate — while the test skipped, a `skipped`
      # line read as `verified` and the whole level was decorative.
      # The commit comes from the vendored manifest, so re-vendoring the
      # contract moves the installed binary with it; nothing here is pinned by
      # hand. The producer is installed into its own virtualenv (it drags in a
      # TUI stack) and only its bin joins PATH.
      - name: install the pinned producer binary (DESIGN-405 level 3)
        run: scripts/install_pinned_checker.sh >> "$GITHUB_PATH"
      # Same discipline for the governance live smoke (WS-005 WS-C): the real
      # gate-check at the commit the vendored gate-verdicts manifest names.
      # tests/test_governance_live_smoke.py FAILS without it, never skips.
      - name: install the pinned steward binary (governance live smoke)
        run: scripts/install_pinned_steward.sh >> "$GITHUB_PATH"
      # Same discipline for the product-proposals live smoke (inbox #129):
      # the real impresario tree at the vendored pin, or the test FAILS.
      - name: checkout pinned impresario (product-proposals live smoke)
        run: |
          dir="$(scripts/checkout_pinned_impresario.sh)"
          echo "IMPRESARIO_PINNED_DIR=$dir" >> "$GITHUB_ENV"
      - run: uv run pytest tests/ -v

  plan-fields:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plan-fields
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pytest
      # PF-7 external-install guard: the package must BUILD with its contract
      # data and run conformance from a CLEAN venv (not the editable in-tree
      # install). The editable install hid a force-include double-add that broke
      # every external consumer; this step is the standing proof that a pinned
      # git/wheel dependency resolves and works.
      - name: wheel builds and conforms from a clean install
        run: |
          uv build
          uv venv /tmp/pf-smoke
          uv pip install --python /tmp/pf-smoke dist/*.whl
          /tmp/pf-smoke/bin/plan-fields conformance
          # the fleet API must resolve a cross-repo edge from the installed wheel
          /tmp/pf-smoke/bin/python -c "from plan_fields import parse_fleet, RepoInput, ManifestIndex; \
            s = parse_fleet([RepoInput('maestro','- [ ] r @owner:o @id:r\n'), \
              RepoInput('proctor','- [ ] x @owner:o @blocked_by:todo://maestro/r @id:x\n')], \
              ManifestIndex(frozenset({'maestro','proctor'}), {})); \
            assert s['edges'] == [{'kind':'blocked_by','source_node_id':'todo://proctor/x','target_node_id':'todo://maestro/r'}], s['edges']"

  vscode-ext:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-ext
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
