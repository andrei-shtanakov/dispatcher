name: upstream-drift (advisory)

# PF-6, guarantee B. Asks whether canon in prograph-vault has moved away from
# the copy vendored here, and says which upstream it asked about.
#
# Deliberately NOT a pull-request check and never a required one: a commit in a
# neighbouring repository must not be able to redden this repository's PRs.
# The PR gate is guarantee A — the vendored copy matches its own manifest —
# which lives in the ordinary test job and needs no network.
#
# A red run here means a human owes a deliberate re-vendor PR. Nothing is
# updated automatically, and the fix is never to edit the expected hash.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, early — a week is the useful resolution
  workflow_dispatch: # no inputs: the ref is fixed below, not caller-supplied

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The MOVING default branch on purpose: pinning the checkout to the
      # commit PINNED.txt names would make this a second run of guarantee A,
      # comparing the copy against the bytes it was made from. Drift can only
      # be seen against where upstream actually is now. The resolved SHA is
      # recorded below, so the run still says exactly what it looked at.
      - uses: actions/checkout@v6
        with:
          repository: andrei-shtanakov/prograph-vault
          ref: master
          path: _upstream/prograph-vault

      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync

      - name: compare canon against the vendored copy
        run: |
          set +e
          uv run python scripts/upstream_drift_report.py \
            _upstream/prograph-vault/authored/contracts/plan-fields/v1 \
            --upstream-root _upstream/prograph-vault \
            --ref master
          code=$?
          set -e
          # 0 no drift · 1 drift · 2 canon unavailable. Unavailable is red too:
          # an upstream nobody could read is unknown, and unknown that looks
          # green is exactly the failure this workstream keeps removing. The
          # code and the summary keep the two apart for whoever reads the run.
          case "$code" in
            0) echo "no upstream drift" ;;
            1) echo "::error::upstream drift — a deliberate re-vendor PR is due" ;;
            2) echo "::error::canon unavailable — nothing was compared (not 'no drift')" ;;
            *) echo "::error::reporter failed with $code" ;;
          esac
          exit "$code"

  # Same guarantee B for the steward gate-catalog/v1 contract (inbox #125).
  # A separate job so one upstream being unreadable does not hide another's
  # drift; a separate reporter because the surface is a single file, not a
  # directory.
  drift-steward-gate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The MOVING default branch on purpose — drift can only be seen against
      # where upstream actually is now; the resolved SHA is recorded by the
      # reporter, so the run still says exactly what it looked at.
      - uses: actions/checkout@v6
        with:
          repository: andrei-shtanakov/steward
          ref: master
          path: _upstream/steward

      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync

      - name: compare steward catalog against the vendored copy
        run: |
          set +e
          uv run python scripts/gate_catalog_drift_report.py \
            _upstream/steward/profiles/gate-catalog.yaml \
            --upstream-root _upstream/steward \
            --ref master
          code=$?
          set -e
          # 0 no drift · 1 drift · 2 canon unavailable. Unavailable is red
          # too: an upstream nobody could read is unknown, and unknown that
          # looks green is exactly the failure this workstream keeps removing.
          case "$code" in
            0) echo "no upstream drift" ;;
            1) echo "::error::upstream drift — a deliberate re-vendor PR is due" ;;
            2) echo "::error::canon unavailable — nothing was compared (not 'no drift')" ;;
            *) echo "::error::reporter failed with $code" ;;
          esac
          exit "$code"

  # Same guarantee B for the steward roles-catalog/v1 contract (inbox #128).
  # A separate job so one upstream being unreadable does not hide another's
  # drift; the reporter is the gate-catalog one parameterized for this
  # contract's single-file surface.
  drift-steward-roles-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The MOVING default branch on purpose — drift can only be seen against
      # where upstream actually is now; the resolved SHA is recorded by the
      # reporter, so the run still says exactly what it looked at.
      - uses: actions/checkout@v6
        with:
          repository: andrei-shtanakov/steward
          ref: master
          path: _upstream/steward

      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync

      - name: compare steward roles catalog against the vendored copy
        run: |
          set +e
          uv run python scripts/roles_catalog_drift_report.py \
            _upstream/steward/profiles/roles.yaml \
            --upstream-root _upstream/steward \
            --ref master
          code=$?
          set -e
          # 0 no drift · 1 drift · 2 canon unavailable. Unavailable is red
          # too: an upstream nobody could read is unknown, and unknown that
          # looks green is exactly the failure this workstream keeps removing.
          case "$code" in
            0) echo "no upstream drift" ;;
            1) echo "::error::upstream drift — a deliberate re-vendor PR is due" ;;
            2) echo "::error::canon unavailable — nothing was compared (not 'no drift')" ;;
            *) echo "::error::reporter failed with $code" ;;
          esac
          exit "$code"

  # Same guarantee B for the steward gate-verdicts/v1 contract (WS-005 WS-B,
  # inbox #106). A separate job so one upstream being unreadable does not hide
  # the other's drift.
  drift-steward-gate-verdicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The MOVING default branch on purpose — drift can only be seen against
      # where upstream actually is now; the resolved SHA is recorded by the
      # reporter, so the run still says exactly what it looked at.
      - uses: actions/checkout@v6
        with:
          repository: andrei-shtanakov/steward
          ref: master
          path: _upstream/steward

      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync

      - name: compare steward canon against the vendored copy
        run: |
          set +e
          uv run python scripts/upstream_drift_report.py \
            _upstream/steward/contracts/gate-verdicts/v1 \
            --vendored contracts/steward-gate-verdicts/v1 \
            --upstream-root _upstream/steward \
            --ref master \
            --canon-probe SCHEMA.json
          code=$?
          set -e
          # 0 no drift · 1 drift · 2 canon unavailable. Unavailable is red
          # too: an upstream nobody could read is unknown, and unknown that
          # looks green is exactly the failure this workstream keeps removing.
          case "$code" in
            0) echo "no upstream drift" ;;
            1) echo "::error::upstream drift — a deliberate re-vendor PR is due" ;;
            2) echo "::error::canon unavailable — nothing was compared (not 'no drift')" ;;
            *) echo "::error::reporter failed with $code" ;;
          esac
          exit "$code"

  # Both impresario contracts, one job: they share a single pin by
  # construction (one re-vendor script), so one checkout answers for both.
  drift-impresario-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The MOVING default branch on purpose — drift can only be seen against
      # where upstream actually is now; the resolved SHA is in the run log.
      - uses: actions/checkout@v6
        with:
          repository: andrei-shtanakov/impresario
          ref: master
          path: _upstream/impresario
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - name: compare canon against both vendored copies
        run: |
          overall=0
          for pair in \
            "contracts/product-proposal/v1|contracts/impresario-product-proposal/v1" \
            "contracts/gate-decision/v1|contracts/impresario-gate-decision/v1" \
            "contracts/loop-state/v1|contracts/impresario-loop-state/v1"; do
            src="${pair%%|*}"; dst="${pair##*|}"
            set +e
            uv run python scripts/upstream_drift_report.py \
              "_upstream/impresario/$src" \
              --vendored "$dst" \
              --upstream-root _upstream/impresario \
              --ref master \
              --canon-probe schema.json
            code=$?
            set -e
            # 0 no drift · 1 drift · 2 canon unavailable. Unavailable and
            # any machinery failure are red too: unknown must not look green.
            case "$code" in
              0) echo "no upstream drift: $dst" ;;
              1) echo "::error::upstream drift in $dst — a deliberate re-vendor PR is due" ;;
              2) echo "::error::canon unavailable for $src — nothing was compared (not 'no drift')" ;;
              *) echo "::error::reporter failed with $code for $dst" ;;
            esac
            [ "$code" -gt "$overall" ] && overall=$code
          done
          exit "$overall"
