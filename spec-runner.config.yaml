# spec-runner configuration (v2.0 flat format)
# Generated by `spec-runner config`. Edit freely.

# --- CLI profile (managed by `spec-runner config`) ---
claude_command: "claude"
claude_model: "sonnet"
command_template: ""
skip_permissions: true
review_command: "claude"
review_model: "sonnet"
review_command_template: ""

# --- Common knobs (uncomment to use) ---
# budget_usd: 10.0
# task_budget_usd: 2.0
# max_concurrent: 3
# telegram_bot_token: ""      # secret — keep out of version control
# telegram_chat_id: ""
# webhook_url: ""

# --- Полиси экосистемы (ADR-ECO-011 / полирепо): master не трогаем ---
# Одна ветка на прогон, один integration-PR в конце; мерж — через
# ревью-контур (review-pr.sh / accept-pr), не самим раннером.
integration_pr: true

# Строгий governance спек: draft не исполняется (spec approve обязателен).
spec_governance: strict

# Потолки бюджета: подъём — только `spec-runner budget authorize` (на записи).
budget_usd: 10.0
task_budget_usd: 2.0

commands:
  test: "uv run pytest tests/ -v"
