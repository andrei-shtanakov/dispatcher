[project]
name = "plan-fields"
version = "0.7.0"
description = "Offline parser + validator for the plan-fields v1 contract (ADR-ECO-005)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
]

# This package is deliberately standalone: it MUST NOT depend on or import the
# dispatcher application. The plan-fields v1 contract is vendored (pinned) under
# src/plan_fields/contract/ — see contract/PINNED.txt. Drift-control is PF-6.

[project.scripts]
plan-fields = "plan_fields.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already walks every file under src/plan_fields, including the
# vendored contract/ data (schema, registries, fixtures, manifest). A
# force-include of that same subtree double-adds each file and fails the wheel
# build — the editable in-tree install hid this until PF-7's external smoke test.
packages = ["src/plan_fields"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]

[dependency-groups]
dev = ["pyrefly", "ruff", "pytest"]
